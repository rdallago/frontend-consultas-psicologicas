<h2>Pacientes</h2>

<!-- 🔍 BUSCADOR -->
<input 
  type="text" 
  placeholder="Buscar por nombre..." 
  [(ngModel)]="filtroNombre"
  (input)="filtrar()"
/>

<br><br>

<!-- ➕ NUEVO -->
<button class="btn" (click)="nuevo()">Nuevo Paciente</button>

<p *ngIf="pacientes.length === 0">Cargando pacientes...</p>

<table class="tabla">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>DNI</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of pacientes">
      <td>{{ p.id }}</td>
      <td>{{ p.nombre }}</td>
      <td>{{ p.apellido }}</td>
      <td>{{ p.dni }}</td>
      <td>
        <button (click)="editar(p)">Editar</button>
        <button (click)="eliminar(p)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
