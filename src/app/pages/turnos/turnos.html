<h2>Gestión de Turnos</h2>

<div class="barra-superior">
  <button (click)="cambiarMes(-1)">◀</button>
  <h3>{{ mesActual + 1 }}/{{ anioActual }}</h3>
  <button (click)="cambiarMes(1)">▶</button>
</div>

<div class="calendario">

  <div class="encabezado">Lun</div>
  <div class="encabezado">Mar</div>
  <div class="encabezado">Mié</div>
  <div class="encabezado">Jue</div>
  <div class="encabezado">Vie</div>
  <div class="encabezado">Sáb</div>
  <div class="encabezado">Dom</div>

  <div
    class="dia"
    *ngFor="let dia of dias"
    (click)="abrirFormulario(dia)">

    <div class="numero-dia">
      {{ dia }}
    </div>

    <!-- TURNOS -->
    <div
      class="turnito"
      [ngClass]="turno.estado.toLowerCase()"
      *ngFor="let turno of turnosDelDia(dia)"
      [title]="turno.motivo || ''"

     (click)="editarTurno(turno); $event.stopPropagation()">

      {{ turno.fechaHora.substring(11,16) }}

    </div>

  </div>

</div>

<!-- ===================================== -->
<!-- MODAL -->
<!-- ===================================== -->

<div class="modal-fondo" *ngIf="mostrarPopup">

  <div class="modal">

    <h3 *ngIf="!editando">
      Nuevo Turno
    </h3>

    <h3 *ngIf="editando">
      Editar Turno
    </h3>

    <!-- FECHA -->
    <label>Fecha y hora</label>

    <input
  type="datetime-local"
  [(ngModel)]="nuevoTurno.fechaHora"
  [disabled]="soloLectura">

    <!-- PACIENTE -->
    <label>Paciente</label>

    <select
  [(ngModel)]="nuevoTurno.pacienteId"
  [disabled]="soloLectura">

      <option value="">
        Seleccione paciente
      </option>

      <option
        *ngFor="let p of pacientes"
        [ngValue]="p.id">

        {{ p.nombre }} {{ p.apellido }}

      </option>

    </select>

    <!-- ===================================== -->
    <!-- ESTADO -->
    <!-- ===================================== -->

    <div *ngIf="editando">

      <label>Estado</label>

      <select [(ngModel)]="nuevoTurno.estado">
          [disabled]="soloLectura">

        <option value="AGENDADO">
          Agendado
        </option>

        <option value="AUSENTE">
          No asistió
        </option>

        <option value="CANCELADO">
          Cancelado
        </option>

      </select>

    </div>

    <!-- ===================================== -->
    <!-- MOTIVO -->
    <!-- ===================================== -->

    <div *ngIf="
      editando &&
      (
        nuevoTurno.estado === 'AUSENTE'
        || nuevoTurno.estado === 'CANCELADO'
      )
    ">

      <label>Motivo</label>

      <textarea
  [(ngModel)]="nuevoTurno.motivo"
  [disabled]="soloLectura"
        placeholder="Ej: paciente no avisó"
        rows="3">
      </textarea>

    </div>

    <!-- ===================================== -->
    <!-- ACCIONES -->
    <!-- ===================================== -->

    <div class="acciones">

      <button
  *ngIf="!soloLectura"
  (click)="guardarTurno()">
        Guardar
      </button>

      <button
  *ngIf="editando && !soloLectura"
        class="rojo"
        [disabled]="
          eliminando ||
          nuevoTurno.estado === 'ASISTIO'
        "
        (click)="eliminarTurno()">

        {{ eliminando ? 'Eliminando...' : 'Eliminar' }}

      </button>

      <button (click)="cerrarPopup()">
        Cerrar
      </button>

    </div>

  </div>

</div>

<!-- ===================================== -->
<!-- TOAST -->
<!-- ===================================== -->

<div class="toast" *ngIf="mostrarToast">
  {{ mensaje }}
</div>
