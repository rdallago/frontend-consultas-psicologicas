<h2>Gestión de Turnos</h2>

<!-- Barra superior -->
<div class="barra-superior">

  <button (click)="cambiarMes(-1)">◀</button>

  <h3>
    {{ mesActual + 1 }}/{{ anioActual }}
  </h3>

  <button (click)="cambiarMes(1)">▶</button>

</div>

<!-- Calendario -->
<div class="calendario">

  <!-- Encabezados -->
  <div class="encabezado">Lun</div>
  <div class="encabezado">Mar</div>
  <div class="encabezado">Mié</div>
  <div class="encabezado">Jue</div>
  <div class="encabezado">Vie</div>
  <div class="encabezado">Sáb</div>
  <div class="encabezado">Dom</div>

  <!-- Días -->
  <div
    class="dia"
    *ngFor="let dia of dias"
    (click)="abrirFormulario(dia)">

    <div class="numero-dia">
      {{ dia }}
    </div>

    <!-- Turnos -->
    <div
      class="turnito"
      [ngClass]="turno.estado.toLowerCase()"
      *ngFor="let turno of turnosDelDia(dia)"
      (click)="editarTurno(turno); $event.stopPropagation()">

      {{ turno.fechaHora.substring(11,16) }}

    </div>

  </div>

</div>

<!-- Modal -->
<div
  class="modal-fondo"
  *ngIf="mostrarPopup">

  <div class="modal">

    <h3 *ngIf="!editando">
      Nuevo Turno
    </h3>

    <h3 *ngIf="editando">
      Editar Turno
    </h3>

    <!-- Fecha -->
    <label>Fecha y hora</label>

    <input
      type="datetime-local"
      [(ngModel)]="nuevoTurno.fechaHora">

    <!-- Paciente -->
    <label>Paciente</label>

    <select
      [(ngModel)]="nuevoTurno.pacienteId">

      <option value="">
        Seleccione paciente
      </option>

      <option
        *ngFor="let p of pacientes"
        [value]="p.id">

        {{ p.nombre }} {{ p.apellido }}

      </option>

    </select>

    <!-- Estado -->
    <div *ngIf="editando">

      <label>Estado</label>

      <select
        [(ngModel)]="nuevoTurno.estado">

        <option value="AGENDADO">
          Agendado
        </option>

        <option value="ASISTIO">
          Asistió
        </option>

      </select>

    </div>

    <!-- Botones -->
    <div class="acciones">

      <button
        type="button"
        (click)="guardarTurno()">

        Guardar

      </button>

      <button
        type="button"
        *ngIf="editando"
        class="rojo"
        [disabled]="eliminando"
        (click)="eliminarTurno()">

        {{ eliminando ? 'Eliminando...' : 'Eliminar' }}

      </button>

      <button
        type="button"
        (click)="cerrarPopup()">

        Cerrar

      </button>

    </div>

  </div>

</div>

<!-- Toast -->
<div
  class="toast"
  *ngIf="mostrarToast">

  {{ mensaje }}

</div>
