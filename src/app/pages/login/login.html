<div class="login-container">

  <h2>Ingreso al sistema</h2>

  <input
    type="text"
    [(ngModel)]="username"
    placeholder="Usuario"
  >

  <input
    type="password"
    [(ngModel)]="password"
    placeholder="Contraseña"
  >

  <button (click)="ingresar()">
    Ingresar
  </button>

  <div *ngIf="error">
    {{ error }}
  </div>

</div>
