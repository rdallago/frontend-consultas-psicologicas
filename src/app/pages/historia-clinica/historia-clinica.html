<h2>Historias Clínicas</h2>

<input
  type="text"
  placeholder="Buscar por paciente..."
  [(ngModel)]="filtroNombre"
  (input)="filtrar()"
  class="buscador"
/>
<br />

<button class="btn-principal" (click)="mostrarFormulario = !mostrarFormulario">
  {{ mostrarFormulario ? 'Cancelar' : 'Nueva Historia Clínica' }}
</button>
<br /><br />

<div *ngIf="mostrarFormulario" class="formulario">
  <label>Paciente:</label>
  <select [(ngModel)]="pacienteSeleccionadoId">
    <option [ngValue]="null">Seleccione paciente</option>
    <option *ngFor="let p of pacientes" [value]="p.id">
      {{ p.nombre }} {{ p.apellido }} ({{ p.dni }})
    </option>
  </select>

  <label>Fecha:</label>
  <input type="date" [(ngModel)]="fechaHistoria" />

  <button (click)="guardarHistoria()">Guardar</button>
</div>
<br />

<p *ngIf="cargando">Cargando historias...</p>

<table class="tabla" *ngIf="!cargando">
  <thead>
    <tr>
      <th>ID</th>
      <th>Paciente</th>
      <th>DNI</th>
      <th>Fecha</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let h of historias">
      <td>{{ h.id }}</td>
      <td>{{ h.paciente?.nombre }} {{ h.paciente?.apellido }}</td>
      <td>{{ h.paciente?.dni }}</td>

      <td>
        <span *ngIf="editandoId !== h.id">
          {{ h.fechaCreacion | date : 'yyyy-MM-dd' }}
        </span>
        <input
          *ngIf="editandoId === h.id"
          type="date"
          [(ngModel)]="nuevaFechaEdicion"
        />
      </td>

      <td>
        <div *ngIf="editandoId !== h.id">
          <button class="btn-editar" (click)="iniciarEdicion(h)">Editar</button>

          <button
            class="btn-eliminar"
            (click)="eliminarHistoria(h)"
            [disabled]="h.visitas?.length > 0"
          >
            Eliminar
          </button>

          <button
            class="btn-secundario"
            (click)="generarHistoriaClinica(h)"
            [disabled]="!h.visitas || h.visitas.length === 0"
          >
            🧠 Historia Clínica
          </button>
        </div>

        <div *ngIf="editandoId === h.id">
          <button class="btn-guardar" (click)="guardarEdicion(h)">
            Guardar
          </button>
          <button class="btn-cancelar" (click)="cancelarEdicion()">
            Cancelar
          </button>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<div class="popup" *ngIf="mostrarPopupHistoria">
  <div class="popup-contenido">
    <h2>Historia Clínica</h2>

    <div class="acciones-historia" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn-generar" (click)="generarHistoriaClinicaIA()">
        🧠 Generar historia clínica IA
      </button>
      <button class="btn-guardar" (click)="guardarHistoriaClinica()">
        💾 Guardar cambios
      </button>
      <button class="btn-pdf" (click)="pdfHistoria(historiaSeleccionada)" style="background-color: #dc3545; color: white;">
        📄 PDF
      </button>
      <button class="btn-cancelar" (click)="mostrarPopupHistoria = false">
        ✖ Cerrar
      </button>
    </div>

    <quill-editor [(ngModel)]="textoHistoriaClinica" [modules]="quillConfig"></quill-editor>
  </div>
</div>
